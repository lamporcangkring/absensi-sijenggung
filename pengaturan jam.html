<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sijenggung Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --sidebar: #1e293b;
            --primary: #3b82f6;
            --accent: #06b6d4;
            --white: #ffffff;
            --text-main: #334155;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font-weight: 700; color: var(--accent); }
        .nav-menu { list-style: none; flex: 1; }
        .nav-item { 
            padding: 14px 18px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 12px; transition: 0.3s; color: rgba(255,255,255,0.7);
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: var(--accent); font-weight: 600; }

        /* --- Mobile Toggle --- */
        .mobile-header { display: none; background: var(--sidebar); color: white; padding: 15px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1100; }
        .menu-toggle { background: none; border: none; color: white; cursor: pointer; }

        /* --- Main Content --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; height: 100vh; transition: 0.3s; }
        .content-page { display: none; animation: fadeIn 0.3s ease; }
        .content-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Components --- */
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-add:hover { background: #2563eb; }
        
        .card { background: var(--white); border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* --- Grid Layout --- */
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* --- Responsiveness --- */
        @media (max-width: 1024px) {
            .config-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { 
                position: fixed; left: -260px; top: 0; height: 100vh; 
                width: 260px; box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            }
            .sidebar.show { left: 0; }
            .mobile-header { display: flex; }
            .main-content { padding: 20px; height: auto; }
            .header-action h1 { font-size: 20px; }
            .btn-add { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div class="logo-area" style="margin-bottom: 0;">
            <i data-lucide="shield-check"></i>
            <span>SIJENGGUNG ADM</span>
        </div>
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
        </button>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <i data-lucide="shield-check"></i>
            <span>SIJENGGUNG ADM</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="window.location.href='dashboard admin.html'">
                <i data-lucide="layout-dashboard" size="18"></i> Dashboard
            </li>
            <li class="nav-item" onclick="window.location.href='data perangkat.html'">
                <i data-lucide="users" size="18"></i> Data Perangkat
            </li>
            <li class="nav-item active" onclick="window.location.href='pengaturan jam.html'">
                <i data-lucide="clock" size="18"></i> Pengaturan Jam
            </li>
            <li class="nav-item" onclick="window.location.href='laporan rekap.html'">
                <i data-lucide="file-text" size="18"></i> Laporan Rekap
            </li>
        </ul>
        <div class="nav-item" style="color:var(--danger)" onclick="handleLogout()">
            <i data-lucide="log-out" size="18"></i> Keluar
        </div>
    </aside>

    <main class="main-content">
        
        <div id="pengaturan-jam" class="content-page active">
            <div class="header-action">
                <div>
                    <h1>Konfigurasi Presensi</h1>
                    <p style="opacity:0.6; font-size:14px;">Atur jam kerja dan lokasi kantor desa.</p>
                </div>
                <button class="btn btn-add" onclick="saveConfig(this)">
                    <i data-lucide="save" size="18"></i> Simpan Pengaturan
                </button>
            </div>

            <div class="config-grid">
                <div class="card">
                    <h3 style="margin-bottom:15px">Waktu Kerja</h3>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Jam Masuk</label>
                        <input type="time" id="jamMasuk" class="input-box" value="07:30">
                    </div>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Toleransi (Menit)</label>
                        <input type="number" id="toleransi" class="input-box" value="15">
                    </div>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Jam Pulang</label>
                        <input type="time" id="jamPulang" class="input-box" value="15:30">
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom:15px">Titik Lokasi Kantor</h3>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Latitude</label>
                        <input type="text" id="lat" class="input-box" value="-7.382104">
                    </div>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Longitude</label>
                        <input type="text" id="lng" class="input-box" value="109.658302">
                    </div>
                    <div class="input-group">
                        <label style="font-size:12px; font-weight:600">Radius Absen (Meter)</label>
                        <input type="number" id="radius" class="input-box" value="50">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        }

        window.addEventListener('load', async () => {
            const user = checkSession();
            if (user && user.role === 'admin') {
                await loadConfig();
            } else if (user) {
                window.location.href = 'beranda.html';
            }
        });
    </script>

</body>
</html>
