<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sijenggung Digital - Riwayat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --nav-bg: #1e293b;
            --accent: #06b6d4;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 120px;
            transition: 0.3s;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            position: relative;
            overflow-y: auto;
        }

        /* --- Responsiveness --- */
        @media (max-width: 480px) {
            .app-container { max-width: 100vw; }
        }

        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Header Riwayat --- */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .month-selector { 
            background: var(--glass); padding: 8px 15px; border-radius: 12px; 
            font-size: 13px; border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 8px;
        }

        /* --- List Riwayat (Cards) --- */
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .history-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .date-box { display: flex; gap: 15px; align-items: center; }
        .day-num { 
            width: 45px; height: 45px; background: var(--nav-bg); 
            border-radius: 12px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border: 1px solid var(--glass-border);
        }
        .day-num span:first-child { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .day-num span:last-child { font-size: 16px; font-weight: 700; }

        .time-info h5 { font-size: 14px; margin-bottom: 2px; }
        .time-info p { font-size: 11px; opacity: 0.5; }

        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .status-hadir { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .status-telat { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-izin { background: rgba(59, 130, 246, 0.1); color: var(--primary); }

        /* --- Nav Dock (Sesuai Gambar) --- */
        .nav-dock {
            position: fixed; bottom: 20px; left: 15px; right: 15px; height: 75px;
            background: var(--nav-bg); border-radius: 28px; display: flex; 
            justify-content: space-around; align-items: center; z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--glass-border);
        }
        .nav-btn { text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-btn.active { color: white; font-weight: 700; }
        .floating-action {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            width: 75px; height: 75px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: 6px solid var(--bg-dark); display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4); cursor: pointer;
        }

        /* --- Content Placeholder (Lainnya) --- */
        .placeholder-box { text-align: center; padding: 40px 20px; opacity: 0.5; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="riwayat" class="page active">
        <div class="history-header">
            <h3>Riwayat Absensi</h3>
            <div class="month-selector">
                <span id="currentMonth">Maret 2026</span> <i data-lucide="chevron-down" size="14"></i>
            </div>
        </div>

        <div class="history-list" id="historyList">
            <div style="text-align:center; padding: 40px; opacity:0.5;">Memuat riwayat...</div>
        </div>
    </div>

    <div class="nav-dock">
        <div class="nav-btn" onclick="window.location.href='beranda.html'">
            <i data-lucide="home"></i><br>Beranda
        </div>
        <div class="nav-btn active" onclick="window.location.href='riwayat.html'">
            <i data-lucide="calendar"></i><br>Riwayat
        </div>
        
        <div class="floating-action" onclick="window.location.href='absen camera.html'">
            <i data-lucide="camera" size="30"></i>
        </div>

        <div class="nav-btn" style="margin-left: 60px;" onclick="window.location.href='pesan.html'">
            <i data-lucide="message-circle"></i><br>Pesan
        </div>
        <div class="nav-btn" onclick="window.location.href='profil.html'">
            <i data-lucide="user"></i><br>Profil
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/main.js"></script>
<script>
    window.addEventListener('load', async () => {
        const user = checkSession();
        if (user) {
            loadHistory(user.id);
            
            const now = new Date();
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('currentMonth').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
        }
    });

    async function loadHistory(perangkatId) {
        const { data, error } = await sb_client
            .from('presensi')
            .select('*')
            .eq('perangkat_id', perangkatId)
            .order('tanggal', { ascending: false })
            .limit(30);

        const list = document.getElementById('historyList');
        if (error || !data || data.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 40px; opacity:0.5;">Belum ada riwayat absensi.</div>';
            return;
        }

        list.innerHTML = '';
        const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

        data.forEach(log => {
            const dateObj = new Date(log.tanggal);
            const dayName = days[dateObj.getDay()];
            const dayNum = dateObj.getDate();
            const statusClass = log.status === 'Tepat Waktu' ? 'status-hadir' : 'status-telat';

            list.insertAdjacentHTML('beforeend', `
                <div class="history-card">
                    <div class="date-box">
                        <div class="day-num"><span>${dayName}</span><span>${dayNum}</span></div>
                        <div class="time-info">
                            <h5>${log.jam_masuk} - --:--</h5>
                            <p>Kantor Desa Sijenggung</p>
                        </div>
                    </div>
                    <div class="status-badge ${statusClass}">${log.status}</div>
                </div>
            `);
        });
        lucide.createIcons();
    }
</script>


<style> @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } } </style>
</body>
</html>
