<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Desa Sijenggung</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --nav-bg: #1e293b;
            --accent: #06b6d4;
            --primary: #3b82f6;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 120px;
        }

        /* Profile Header */
        .profile-hero { text-align: center; margin-bottom: 30px; }
        .avatar-circle {
            width: 90px; height: 90px;
            background: var(--nav-bg);
            border: 3px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }

        /* List Menu */
        .section-label { 
            font-size: 12px; color: var(--accent); 
            text-transform: uppercase; margin: 20px 0 10px 5px; 
        }
        
        .menu-list { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            overflow: hidden; 
        }

        .menu-row {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .menu-row:last-child { border-bottom: none; }
        
        .label-group { flex: 1; }
        .label-text { font-size: 11px; opacity: 0.5; }
        .val-text { font-size: 14px; font-weight: 600; display: block; margin-top: 2px; }

        /* Bottom Nav sesuai gambar image_df43c2.png */
        .nav-dock {
            position: fixed; bottom: 20px; width: 90%; max-width: 380px;
            height: 70px; background: var(--nav-bg);
            border-radius: 25px; display: flex; align-items: center;
            justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; cursor: pointer; }
        .nav-item.active { color: white; font-weight: bold; }
        .floating-btn {
            width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%; margin-top: -40px; border: 5px solid var(--bg-dark);
            display: flex; align-items: center; justify-content: center; color: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-hero">
        <div class="avatar-circle">👤</div>
        <h2>Budi Santoso</h2>
        <p style="opacity: 0.7; font-size: 14px;">Kaur Keuangan • Sijenggung</p>
    </div>

    <div class="section-label">Data Perangkat</div>
    <div class="menu-list">
        <div class="menu-row">
            <i data-lucide="user" size="18"></i>
            <div class="label-group">
                <span class="label-text">Nama Lengkap</span>
                <span class="val-text">Budi Santoso</span>
            </div>
        </div>
        <div class="menu-row">
            <i data-lucide="mail" size="18"></i>
            <div class="label-group">
                <span class="label-text">Email</span>
                <span class="val-text">budi@sijenggung.desa.id</span>
            </div>
        </div>
        <div class="menu-row" style="opacity: 0.6;">
            <i data-lucide="credit-card" size="18"></i>
            <div class="label-group">
                <span class="label-text">NIPD (Terkunci)</span>
                <span class="val-text">198501222011011003</span>
            </div>
            <i data-lucide="lock" size="14"></i>
        </div>
    </div>

    <div class="section-label">Keamanan</div>
    <div class="menu-list">
        <div class="menu-row" style="cursor: pointer;">
            <i data-lucide="key" size="18"></i>
            <div class="label-group">
                <span class="val-text">Ganti Password</span>
            </div>
            <i data-lucide="chevron-right" size="18"></i>
        </div>
    </div>

    <div class="nav-dock">
        <div class="nav-item">
            <i data-lucide="home"></i><br>Beranda
        </div>
        <div class="nav-item">
            <i data-lucide="calendar"></i><br>Riwayat
        </div>
        <div class="floating-btn">
            <i data-lucide="camera" size="28"></i>
        </div>
        <div class="nav-item">
            <i data-lucide="message-square"></i><br>Pesan
        </div>
        <div class="nav-item active">
            <i data-lucide="user"></i><br>Profil
        </div>
    </div>
</div>

<script>
    // Menjalankan Icon
    lucide.createIcons();
</script>

</body>
</html>
