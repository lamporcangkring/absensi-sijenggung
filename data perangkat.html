<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sijenggung - Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --sidebar: #1e293b;
            --primary: #3b82f6;
            --accent: #06b6d4;
            --white: #ffffff;
            --text-main: #334155;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow: hidden; }

        /* --- Sidebar Style --- */
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font-weight: 700; color: var(--accent); }
        .nav-menu { list-style: none; flex: 1; }
        .nav-item { 
            padding: 14px 18px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 12px; transition: 0.3s; color: rgba(255,255,255,0.7);
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: var(--accent); font-weight: 600; }

        /* --- Mobile Toggle --- */
        .mobile-header { display: none; background: var(--sidebar); color: white; padding: 15px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1100; }
        .menu-toggle { background: none; border: none; color: white; cursor: pointer; }

        /* --- Main Content --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; height: 100vh; transition: 0.3s; }
        .content-page { display: none; animation: fadeIn 0.3s ease; }
        .content-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Table Components --- */
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-add { background: var(--primary); color: white; }
        
        .card-table { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #f1f5f9; font-size: 13px; color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        /* --- Modal Style --- */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center; padding: 20px; }
        .modal-body { background:white; padding:30px; border-radius:20px; width:100%; max-width:400px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .input-box { width:100%; padding:12px; margin: 8px 0 18px; border:1px solid #ddd; border-radius:10px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        /* --- Responsiveness --- */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { 
                position: fixed; left: -260px; top: 0; height: 100vh; 
                width: 260px; box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            }
            .sidebar.show { left: 0; }
            .mobile-header { display: flex; }
            .main-content { padding: 20px; height: auto; }
            .header-action h1 { font-size: 20px; }
            .btn-add { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div class="logo-area" style="margin-bottom: 0;">
            <i data-lucide="shield-check"></i>
            <span>SIJENGGUNG ADM</span>
        </div>
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
        </button>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <i data-lucide="shield-check"></i>
            <span>SIJENGGUNG ADM</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="window.location.href='dashboard admin.html'">
                <i data-lucide="layout-dashboard" size="18"></i> Dashboard
            </li>
            <li class="nav-item active" onclick="window.location.href='data perangkat.html'">
                <i data-lucide="users" size="18"></i> Data Perangkat
            </li>
            <li class="nav-item" onclick="window.location.href='pengaturan jam.html'">
                <i data-lucide="clock" size="18"></i> Pengaturan Jam
            </li>
            <li class="nav-item" onclick="window.location.href='laporan rekap.html'">
                <i data-lucide="file-text" size="18"></i> Laporan Rekap
            </li>
        </ul>
        <div class="nav-item" style="color:var(--danger)" onclick="handleLogout()">
            <i data-lucide="log-out" size="18"></i> Keluar
        </div>
    </aside>

    <main class="main-content">
        
        <div id="data-perangkat" class="content-page active">
            <div class="header-action">
                <div>
                    <h1>Manajemen Perangkat Desa</h1>
                    <p style="opacity:0.6; font-size:14px;">Tambah atau hapus data perangkat Desa Sijenggung.</p>
                </div>
                <button class="btn btn-add" onclick="openModal()">
                    <i data-lucide="user-plus" size="18"></i> Tambah Perangkat
                </button>
            </div>

            <div class="card-table">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Lengkap</th>
                            <th>NIPD</th>
                            <th>Jabatan</th>
                            <th style="text-align: right;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalAdd" class="modal">
        <div class="modal-body">
            <h3 style="margin-bottom:5px">Tambah Perangkat Baru</h3>
            <p style="font-size:12px; opacity:0.6; margin-bottom:20px">Masukkan data sesuai SK perangkat desa.</p>
            
            <label style="font-size:12px; font-weight:600;">Nama Lengkap</label>
            <input type="text" id="newName" class="input-box" placeholder="Masukkan Nama">
            
            <label style="font-size:12px; font-weight:600;">NIPD</label>
            <input type="text" id="newNIPD" class="input-box" placeholder="Masukkan NIPD">

            <label style="font-size:12px; font-weight:600;">Jabatan (Manual)</label>
            <input type="text" id="newJab" class="input-box" placeholder="Ketik Jabatan Manual">

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-add" style="flex:1; justify-content:center" onclick="addPerangkat()">Simpan Data</button>
                <button class="btn" style="flex:1; background:#f1f5f9; justify-content:center" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        }

        window.addEventListener('load', () => {
            const user = checkSession();
            if (user && user.role === 'admin') {
                getPerangkat();
            } else if (user) {
                window.location.href = 'beranda.html';
            }
        });
    </script>
