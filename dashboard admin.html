<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Sijenggung Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --sidebar: #1e293b;
            --primary: #3b82f6;
            --accent: #06b6d4;
            --white: #ffffff;
            --text-main: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        /* --- Sidebar --- */
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; }
        .logo-section { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font-weight: 700; font-size: 18px; }
        .nav-menu { list-style: none; flex: 1; }
        .nav-item { 
            padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 12px; transition: 0.3s; opacity: 0.7;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); opacity: 1; color: var(--accent); }

        /* --- Main Content --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* --- Statistik Card --- */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h4 { font-size: 14px; opacity: 0.6; margin-bottom: 10px; }
        .card h2 { font-size: 28px; color: var(--sidebar); }

        /* --- Pengaturan Jam & Tabel --- */
        .config-section { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        .settings-form { background: var(--white); padding: 25px; border-radius: 16px; height: fit-content; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        .rekap-table { background: var(--white); padding: 25px; border-radius: 16px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f1f5f9; font-size: 13px; opacity: 0.7; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .bg-success { background: #dcfce7; color: #166534; }
        .bg-warning { background: #fef9c3; color: #854d0e; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-section">
            <i data-lucide="shield-check" color="#06b6d4"></i>
            SIJENGGUNG ADM
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="window.location.href='dashboard admin.html'"><i data-lucide="layout-dashboard" size="20"></i> Dashboard</li>
            <li class="nav-item" onclick="window.location.href='data perangkat.html'"><i data-lucide="users" size="20"></i> Data Perangkat</li>
            <li class="nav-item" onclick="window.location.href='pengaturan jam.html'"><i data-lucide="clock" size="20"></i> Pengaturan Jam</li>
            <li class="nav-item" onclick="window.location.href='laporan rekap.html'"><i data-lucide="file-text" size="20"></i> Laporan Rekap</li>
        </ul>
        <div class="nav-item" style="margin-top: auto; color: #ef4444;" onclick="handleLogout()"><i data-lucide="log-out" size="20"></i> Keluar</div>
    </aside>

    <main class="main-content">
        <div class="header">
            <div>
                <h1>Ringkasan Kehadiran</h1>
                <p id="currentDateDisplay" style="opacity: 0.6;">Kamis, 26 Maret 2026</p>
            </div>
            <button class="btn-primary" onclick="alert('Mengekspor Rekap ke Excel...')">
                <i data-lucide="download" size="16"></i> Cetak Laporan
            </button>
        </div>

        <div class="stats-grid">
            <div class="card"><h4>Total Perangkat</h4><h2>--</h2></div>
            <div class="card"><h4>Hadir Hari Ini</h4><h2>--</h2></div>
            <div class="card"><h4>Terlambat</h4><h2 style="color: #f59e0b;">0</h2></div>
            <div class="card"><h4>Izin/Sakit</h4><h2>0</h2></div>
        </div>

        <div class="config-section">
            <div class="settings-form">
                <h3>Aturan Jam Kerja</h3>
                <hr style="margin: 15px 0; opacity: 0.1;">
                <div class="input-group">
                    <label>Jam Masuk</label>
                    <input type="time" id="jamMasuk" value="07:30">
                </div>
                <div class="input-group">
                    <label>Toleransi (Menit)</label>
                    <input type="number" id="toleransi" value="15">
                </div>
                <div class="input-group">
                    <label>Jam Pulang</label>
                    <input type="time" id="jamPulang" value="15:30">
                </div>
                <button class="btn-primary" style="width: 100%;" onclick="alert('Pengaturan Berhasil Disimpan!')">Update Aturan</button>
            </div>

            <div class="rekap-table">
                <h3>Log Presensi Terbaru</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nama Perangkat</th>
                            <th>Jam Masuk</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="logPresensiBody">
                        <tr>
                            <td colspan="4" style="text-align:center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Jalankan saat halaman dimuat
        window.addEventListener('load', async () => {
            const user = checkSession();
            if (user && user.role === 'admin') {
                setTodayDate();
                updateDashboardStats();
                // Opsional: Load log presensi terbaru
                loadRecentLogs();
            } else if (user) {
                // Jika bukan admin tapi login, lempar ke profil
                window.location.href = 'profil.html';
            }
        });

        async function loadRecentLogs() {
            const today = new Date().toISOString().split('T')[0];
            const { data, error } = await sb_client
                .from('presensi')
                .select('*, perangkat(nama)')
                .eq('tanggal', today)
                .order('jam_masuk', { ascending: false })
                .limit(5);

            const tbody = document.getElementById('logPresensiBody');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Belum ada data hadir hari ini.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(log => {
                const statusClass = log.status === 'Tepat Waktu' ? 'bg-success' : 'bg-warning';
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${log.perangkat.nama}</td>
                        <td>${log.jam_masuk}</td>
                        <td><span class="badge ${statusClass}">${log.status}</span></td>
                        <td><i data-lucide="eye" size="16" style="cursor:pointer"></i></td>
                    </tr>
                `);
            });
            lucide.createIcons();
        }
    </script>

</body>
</html>
