<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sijenggung Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --nav-bg: #1e293b;
            --accent: #06b6d4;
            --primary: #3b82f6;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 22px;
            margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }

        h2 { font-size: 24px; margin-bottom: 8px; }
        p { font-size: 14px; opacity: 0.6; margin-bottom: 30px; }

        .input-group {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
        }

        .input-group i { color: var(--accent); margin-right: 15px; opacity: 0.8; }

        input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 15px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border: none;
            color: white;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            transition: 0.3s;
        }

        .btn-login:active { transform: scale(0.98); opacity: 0.9; }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-area">
        <div class="logo-icon">
            <i data-lucide="shield-check" color="white" size="40"></i>
        </div>
        <h2>Sijenggung Digital</h2>
        <p>Sistem Informasi & Presensi Perangkat Desa</p>
    </div>

    <div class="input-group">
        <i data-lucide="user"></i>
        <input type="text" placeholder="Masukkan NIPD" id="nipd">
    </div>

    <div class="input-group">
        <i data-lucide="lock"></i>
        <input type="password" placeholder="Kata Sandi" id="pass">
    </div>

    <div style="text-align: right; margin-bottom: 25px;">
        <a href="#" style="color: var(--accent); font-size: 12px; text-decoration: none;">Lupa Password?</a>
    </div>

    <button class="btn-login" onclick="handleLogin()">MASUK SEKARANG</button>

    <div class="footer-text">
        Pemerintah Desa Sijenggung<br>
        Kec. Banjarmangu, Kab. Banjarnegara
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/main.js"></script>
<script>
    lucide.createIcons();
</script>

</body>
</html>
